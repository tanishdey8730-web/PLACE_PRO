name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: placepro-ai/package-lock.json

      - name: Install dependencies
        working-directory: placepro-ai
        run: npm install

      - name: Generate Prisma client
        working-directory: placepro-ai
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://placepro:placepro@localhost:5432/placepro

      - name: Lint web
        working-directory: placepro-ai
        run: npm run lint

      - name: Build web
        working-directory: placepro-ai
        run: npm run build -w @placepro/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & verify AI service
        working-directory: placepro-ai/apps/ai-service
        run: |
          pip install -r requirements.txt
          python -c "from main import app; print('AI service OK')"
